[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turboquant-moe"
version = "0.1.2"
description = "TurboQuant-MoE: KV-cache compression + MoE expert caching for efficient LLM inference."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Denis Remizov", email = "remizovcrypto@gmail.com" },
]
keywords = ["llm", "moe", "quantization", "kv-cache", "inference", "turboquant"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "structlog>=23.0",
  "aiohttp>=3.9",
  "psutil>=5.9",
  "safetensors>=0.4",
  "pandas>=2.0",
]

[project.optional-dependencies]
triton = ["triton>=2.2.0"]
transformers = [
  "transformers>=4.40.0",
  "accelerate>=0.25.0",
]
vllm = ["vllm>=0.4.0"]
ollama = []
chroma = ["chromadb>=0.4.0"]
qdrant = ["qdrant-client>=1.8.0"]
benchmark = [
  "plotly>=5.18",
  "tqdm>=4.66",
  "nvidia-ml-py>=12.0",
]
flash-attn = ["flash-attn>=2.5.0"]
dev = [
  "pytest>=7.4",
  "pytest-asyncio",
  "pytest-benchmark",
  "ruff>=0.3",
  "mypy>=1.8",
  "hypothesis>=6.92",
]
all = [
  "turboquant-moe[triton,transformers,vllm,ollama,chroma,qdrant,benchmark,flash-attn,dev]",
]

[project.urls]
Homepage = "https://github.com/RemizovDenis/turboquant"
Repository = "https://github.com/RemizovDenis/turboquant"
Issues = "https://github.com/RemizovDenis/turboquant/issues"

[project.scripts]
turboquant-benchmark = "turboquant.benchmarks.benchmark:main"
turboquant-proxy = "turboquant.integrations.ollama:main"

[tool.hatch.build.targets.wheel]
packages = ["turboquant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
