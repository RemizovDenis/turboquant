[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turboquant"
version = "0.1.0"
description = "Production-ready implementation of Google's TurboQuant algorithm: 4x memory reduction for LLM KV-cache with zero recall degradation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Denis Remizov", email = "cryptomillioner@icloud.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["quantization", "kv-cache", "llm", "inference", "memory-optimization", "turboquant"]

dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26",
    "structlog>=23.2.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
    "safetensors>=0.4.0",
    "pandas>=2.1.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
transformers = [
    "transformers>=4.40.0",
    "accelerate>=0.27.0",
]
ollama = []  # aiohttp already in base
chroma = [
    "chromadb>=0.4.0",
]
qdrant = [
    "qdrant-client>=1.8.0",
]
benchmark = [
    "plotly>=5.18.0",
    "tqdm>=4.66.0",
    "nvidia-ml-py>=12.535.0",
    "tabulate>=0.9.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
all = [
    "turboquant[transformers,chroma,qdrant,benchmark,dev]",
]

[project.urls]
Homepage = "https://github.com/remizovdenis/turboquant"
Documentation = "https://github.com/remizovdenis/turboquant#readme"
Repository = "https://github.com/remizovdenis/turboquant"
Issues = "https://github.com/remizovdenis/turboquant/issues"

[project.scripts]
turboquant-benchmark = "turboquant.benchmarks.benchmark:main"
turboquant-proxy = "turboquant.integrations.ollama:main"

[tool.hatch.build.targets.wheel]
packages = ["turboquant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
