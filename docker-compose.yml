version: "3.9"

# TurboQuant + Ollama stack for Paris VPS deployment
# Usage: docker compose up -d

services:
  # ---- Ollama LLM server ----
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - tq_network
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: "4.0"
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1

  # ---- TurboQuant proxy ----
  turboquant-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA: "false"
    container_name: turboquant-proxy
    restart: unless-stopped
    ports:
      - "11435:11435"
    env_file:
      - .env
    depends_on:
      - ollama
    networks:
      - tq_network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:11435/tq/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:latest
    container_name: tq-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - tq_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:latest
    container_name: tq-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-turboquant}
    depends_on:
      - prometheus
    networks:
      - tq_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  tq_network:
    driver: bridge

volumes:
  ollama_models:
  prometheus_data:
  grafana_data:
