version: "3.9"

services:
  turboquant-proxy:
    build:
      context: .
      dockerfile: ${TQ_DOCKERFILE:-Dockerfile}
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - PROXY_PORT=${PROXY_PORT}
      - TQ_BITS=${TQ_BITS}
      - TQ_GROUP_SIZE=${TQ_GROUP_SIZE}
      - TQ_RESIDUAL=${TQ_RESIDUAL}
      - TQ_MOE_ENABLED=${TQ_MOE_ENABLED}
      - TQ_GPU_CACHE_EXPERTS=${TQ_GPU_CACHE_EXPERTS}
      - TQ_MAX_SEQ_LEN=${TQ_MAX_SEQ_LEN}
      - TQ_PREFETCH_DEPTH=${TQ_PREFETCH_DEPTH}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
    ports:
      - "11435:11435"
    depends_on:
      - ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    restart: unless-stopped

volumes:
  ollama_models:
  prometheus_data:
  grafana_data:
